lessons:
  agents-in-5-min:
    en:
      title: "3 Agents. Zero Dashboard."
      punch: Spin a tiny agent hop in the browser — discover → invoke → done.
      academy_label: AI Agent Orchestration
      demo_label: Search live capabilities
      short_beats: ["Agents find agents", "No human in the loop", "One hop. Receipt included."]
    ru:
      title: "3 агента. Ноль дашбордов."
      punch: Крошечный hop (хоп) в браузере — discover → invoke → готово.
      academy_label: Оркестрация AI-агентов
      demo_label: Найти живые возможности
      short_beats: ["Агенты находят агентов", "Без человека в цикле", "Один hop (хоп). Квитанция в комплекте."]
    es:
      title: "3 agentes. Cero dashboard."
      punch: Un salto (hop) mínimo en el navegador — discover → invoke → listo.
      academy_label: Orquestación de agentes IA
      demo_label: Buscar capacidades en vivo
      short_beats: ["Agentes encuentran agentes", "Sin humano en el loop", "Un salto (hop). Recibo incluido."]
    fr:
      title: "3 agents. Zéro dashboard."
      punch: Un micro-saut (hop) dans le navigateur — discover → invoke → terminé.
      academy_label: Orchestration d'agents IA
      demo_label: Chercher des capacités live
      short_beats: ["Les agents trouvent des agents", "Pas d'humain dans la boucle", "Un saut (hop). Reçu inclus."]
    zh:
      title: "三个智能体。零仪表盘。"
      punch: 浏览器里一次小跳 (hop) — 发现 → 调用 → 完成。
